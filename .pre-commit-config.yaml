repos:
  - repo: local
    hooks:
      # Prevent committing .rej files
      - id: forbidden-files
        name: forbidden files
        entry: found Copier update rejection files; review them and remove them
        language: fail
        files: "\\.rej$"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      # --no-sort-keys: the schema JSON files order keys by meaning, not
      # alphabetically (a convention row reads table, column, quantity_type,
      # unit, description). The three map files below additionally keep one
      # object per line, or compact inline dicts, so a 265-row table stays
      # reviewable in a diff; expanding them costs 3-7x the lines.
      - id: pretty-format-json
        args: [--autofix, --indent=2, --no-sort-keys]
        exclude: "^schema/(column_conventions|schema_map|sql_codegen_map)\\.json$"
      - id: trailing-whitespace
      - id: check-merge-conflict
        args: [--assume-in-merge]
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint-fix
        args: [--disable=MD013]
  - repo: https://github.com/citation-file-format/cffconvert
    rev: 054bda51dbe278b3e86f27c890e3f3ac877d616c
    hooks:
      - id: validate-cff
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v4.0.0-alpha.8" # Use the sha or tag you want to point at
    hooks:
      - id: prettier
        types_or: [yaml]
        exclude: ".copier-answers.yml"
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
