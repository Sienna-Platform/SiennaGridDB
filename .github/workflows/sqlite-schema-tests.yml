name: Sqlite Schema tests

on:
  push:
    branches:
      - main
    tags: ["*"]
  # Every branch, not just PRs into main: this repo develops in stacked PRs
  # (#174 -> #173 -> main and so on), and branch-filtering to main meant the
  # stacked ones never ran CI at all.
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .schema-version pins the SiennaSchemas release the generated tables and
      # registry come from. update-schema.yml moves it; tracking main would let
      # an upstream change break CI on an unrelated PR.
      - name: Read the pinned SiennaSchemas release
        id: schemas
        run: echo "ref=$(cat .schema-version)" >> "$GITHUB_OUTPUT"

      - name: Checkout SiennaSchemas
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/SiennaSchemas
          ref: ${{ steps.schemas.outputs.ref }}
          path: SiennaSchemas

      # TODO after psy6 merges to PowerSystems main: drop `ref`.
      # Needed so the L3 schemas<->PSY layer of check_units_sync.py runs in CI.
      - name: Checkout PowerSystems (psy6) for the L3 PSY-drift gate
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/PowerSystems.jl
          ref: psy6
          path: PowerSystems.jl
          fetch-depth: 1

      # Without this, test/test_load_models.py importorskips and its two model
      # round-trip tests silently never run in CI.
      - name: Checkout power-openapi-models for the model round-trip tests
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/power-openapi-models
          ref: 82c0d0c3edd72216e5ffbe177271d5e3b598df40
          path: power-openapi-models
          fetch-depth: 1

      - uses: extractions/setup-just@v3

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # pydantic is power-openapi-models' only runtime dep; without it the
        # model round-trip tests importorskip instead of running.
        run: pip install pytest "pydantic>=2"

      - name: Build database
        run: just new-db

      - name: Run pytest suite
        run: python3 -m pytest test/ -v

      - name: Verify unit registry seal
        run: python3 scripts/verify_unit_registry.py griddb-example.sqlite

      - name: Check registry staleness
        run: |
          python3 scripts/generate_unit_registry.py --units-json SiennaSchemas/Core/units.json
          git diff --exit-code schema/unit_registry.sql

      # Fails on any schema file or property with no decision in schema_map.json /
      # sql_codegen_map.json, and on generated tables or conventions that are stale.
      - name: Check the generated tables against the schemas
        run: python3 scripts/generate_sql_schema.py --schemas-path SiennaSchemas --check

      - name: Cross-repo units sync check
        run: python3 scripts/check_units_sync.py --schemas-path SiennaSchemas --psy-path PowerSystems.jl --db griddb-example.sqlite

      - name: Check insert manifest staleness
        run: python3 scripts/generate_insert_manifest.py --schemas-path SiennaSchemas --check
