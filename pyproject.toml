[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

# SiennaGridDB ships SQL, not a Python package. There is no importable module
# here: schema/*.sql is the product, scripts/*.py is the tooling that generates
# and verifies it. This [project] table exists so `pip install -e ".[dev]"` sets
# up the test environment and so the linters have a home -- it is deliberately
# NOT a publishable distribution, and `packages = []` below stops setuptools
# auto-discovering schema/ and shipping it as a top-level `schema` package.
# The release artifact is the tarball built by .github/workflows/release.yml.
[project]
name = "sienna-griddb"
version = "0.1.0"
description = "The canonical SQLite schema and sealed unit registry for Sienna applications."
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["sienna", "power-systems", "sqlite", "schema", "units"]
authors = [{ name = "Joseph McKinsey", email = "joseph.mckinsey@nrel.gov" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
]
# No runtime dependencies: nothing here is imported at run time. pydantic is a
# test-only dep, pulled in by test/test_load_models.py via power-openapi-models.
dependencies = []

[project.urls]
Homepage = "https://github.com/Sienna-Platform/SiennaGridDB"
Repository = "https://github.com/Sienna-Platform/SiennaGridDB"
Issues = "https://github.com/Sienna-Platform/SiennaGridDB/issues"

[project.optional-dependencies]
dev = ["pytest>=7.2.1", "pytest-cov", "ruff", "pre-commit", "pydantic>=2"]
docs = ["sphinx>=7", "myst-parser", "sphinx_math_dollar", "nbsphinx"]

[tool.setuptools]
packages = []

# Linter + formatter configuration
[tool.ruff]
line-length = 92
# target-version belongs here, NOT under [tool.ruff.lint]: ruff rejects it as an
# unknown field there and then refuses to load the config at all, silently
# disabling every rule. Keep it above the lint table so that stays obvious.
target-version = "py39"

# Staged adoption. Deliberately NOT yet enabled, with measured cost at the time of writing:
#   E501  44 findings, none auto-fixable (ruff never wraps lines)
#   UP    42 findings, 26 of them unsafe fixes (%-format -> f-string)
#   D    185 findings, 144 needing hand-written prose (86 undocumented functions)
# Enable them one family per PR; test/test_unit_registry.py alone owns 81 of the D.
[tool.ruff.lint]
select = [
  "E4",  # pycodestyle: imports
  "E7",  # pycodestyle: statements
  "E9",  # pycodestyle: runtime/syntax errors
  "F",   # pyflakes
  "TD",  # flake8-todos
  "PD",  # pandas vet
  "RUF", # Ruff rules
  "N",   # pep8-naming
]

# Allow unused variables when underscore-prefixed.
#dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
#exclude = ["tests"]

# Applies once D is enabled; harmless until then.
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.sqlfluff.core]
dialect = "sqlite"

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
]
